          description: ''
  /api/cart/:
    get:
      operationId: cart_retrieve
      description: |-
        Get customer cart, add item to cart, or clear cart.
        Enforces server-side validation of availability and pricing.
      tags:
      - cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    post:
      operationId: cart_create
      description: |-
        Get customer cart, add item to cart, or clear cart.
        Enforces server-side validation of availability and pricing.
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddToCartInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddToCartInputRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_destroy
      description: |-
        Get customer cart, add item to cart, or clear cart.
        Enforces server-side validation of availability and pricing.
      tags:
      - cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/cart/items/{item_id}/:
    delete:
      operationId: cart_items_destroy
      description: Remove a specific item from the cart.
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/catalog/admin/templates/:
    get:
      operationId: catalog_admin_templates_list
      description: Administrative management for all templates (draft, published,
        unpublished, archived).
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: is_featured
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ARCHIVED
          - DRAFT
          - PUBLISHED
          - UNPUBLISHED
        description: |-
          * `DRAFT` - Draft
          * `PUBLISHED` - Published
          * `UNPUBLISHED` - Unpublished
          * `ARCHIVED` - Archived
      tags:
      - catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminTemplateList'
          description: ''
    post:
      operationId: catalog_admin_templates_create
      description: Administrative management for all templates (draft, published,
        unpublished, archived).
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTemplateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminTemplateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminTemplateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTemplate'
          description: ''
