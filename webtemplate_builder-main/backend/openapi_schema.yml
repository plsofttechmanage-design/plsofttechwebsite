components:
  schemas:
    AddToCartInputRequest:
      type: object
      properties:
        template_id:
          type: integer
      required:
      - template_id
    AdminTemplate:
      type: object
      description: Full template management serializer for administrators.
      properties:
        id:
          type: integer
          readOnly: true
        category_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        short_description:
          type: string
          nullable: true
          maxLength: 300
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 10
        thumbnail:
          type: string
          format: uri
          nullable: true
        preview_url:
          nullable: true
          description: Live demo or iframe preview link
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        package_file:
          type: string
          format: uri
          nullable: true
          description: Protected archive file (.zip) unlocked only after verified
            payment
        current_version:
          type: string
          maxLength: 20
        status:
          $ref: '#/components/schemas/Status741Enum'
        is_featured:
          type: boolean
        features:
          description: List of feature bullet points
        compatibility:
          type: string
          maxLength: 255
        default_config:
          description: Default customizable settings schema (colors, typography, section
            contents)
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        category:
          type: integer
          nullable: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        tags:
          type: array
          items:
            type: integer
      required:
      - category_name
      - created_at
      - created_by
      - description
      - id
      - slug
      - title
      - updated_at
    AdminTemplateRequest:
      type: object
      description: Full template management serializer for administrators.
      properties:
        title:
