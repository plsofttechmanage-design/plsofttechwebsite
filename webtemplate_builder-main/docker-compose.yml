version: '3.8'

services:
  # ==============================================================================
  # Database Service: Production MySQL 8.0
  # ==============================================================================
  db:
    image: mysql:8.0
    container_name: marketplace_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-website_marketplace}
      MYSQL_USER: ${DB_USER:-marketplace_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-marketplace_secret_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_master_pass_123}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-marketplace_user}", "--password=${DB_PASSWORD:-marketplace_secret_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - marketplace_network

  # ==============================================================================
  # Backend API Service: Django REST Framework + Gunicorn + WhiteNoise
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketplace_backend
    restart: unless-stopped
    environment:
      DEBUG: "${DEBUG:-0}"
      SECRET_KEY: "${SECRET_KEY:-django-insecure-prod-marketplace-jwt-deploy-key-change-in-env}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}"
      DB_ENGINE: "${DB_ENGINE:-mysql}"
      DB_NAME: "${DB_NAME:-website_marketplace}"
      DB_USER: "${DB_USER:-marketplace_user}"
      DB_PASSWORD: "${DB_PASSWORD:-marketplace_secret_pass}"
      DB_HOST: "db"
      DB_PORT: "3306"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1}"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - marketplace_network

  # ==============================================================================
  # Frontend Web Service: React (Vite) + Nginx SPA Reverse Proxy
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketplace_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - marketplace_network

volumes:
  db_data:
    name: marketplace_db_data
  media_data:
    name: marketplace_media_data
  static_data:
    name: marketplace_static_data

networks:
  marketplace_network:
    name: marketplace_network
    driver: bridge

